[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loan-default-risk"
version = "1.3.0"
requires-python = ">=3.11"
dependencies = ["pandas","scikit-learn>=1.9.1","lightgbm","fastapi","uvicorn","pydantic>=2","pyarrow","scipy","matplotlib","shap","mlflow","pandera","evidently","streamlit","gradio","httpx"]

[project.optional-dependencies]
dev = ["ruff","black","mypy","pytest","pytest-cov","pre-commit"]
demo = ["gradio"]
dashboard = ["streamlit"]
monitoring = ["evidently"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
