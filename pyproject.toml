[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loan-default-risk"
version = "2.0.0"
description = "Probability-of-default scoring with isotonic calibration, profit-thresholded policy and SHAP adverse-action reasons."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "DEVIREDDY BHARADWAJA REDDY" }]
keywords = ["credit-risk", "default-prediction", "lending-club", "lightgbm", "calibration", "shap", "fastapi", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Runtime dependencies, with lower bounds. `pydantic-settings` is NOT optional:
# src/loan_default_risk/config.py imports it at module scope, so a clean
# install that omitted it produced an API image that crashed on import.
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "scipy>=1.13",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "shap>=0.46",
    "mlflow>=2.15",
    "matplotlib>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Title and environment-only extras. `production` keeps only the serving path.
dev = [
    "ruff>=0.8",
    "black>=24.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]
data = ["pandera>=0.21", "evidently>=0.7"]
demo = ["gradio>=4.44"]
dashboard = ["streamlit>=1.35"]

[project.urls]
Homepage = "https://github.com/WHITEJACK5/loan-default-risk"
Documentation = "https://github.com/WHITEJACK5/loan-default-risk/blob/main/docs/REMEDIATION.md"
Repository = "https://github.com/WHITEJACK5/loan-default-risk"
Demo = "https://whitejack5-loan-default-risk.hf.space"
Security = "https://github.com/WHITEJACK5/loan-default-risk/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- ruff ---
# The rule set is chosen to catch real defects rather than to force one style:
# unused imports and undefined names, suspicious constructs, unsafe subprocess
# and pickle use, pathlib handling and import hygiene. Stylistic rules that the
# existing codebase predates (mandatory annotations on every function, line
# length) stay enabled but scoped so a lint failure means something.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["mlruns", "hf-space", ".venv", "docs", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports, undefined names
    "I",        # import sorting
    "B",        # bugbear: suspicious, likely-buggy constructs
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "RUF",      # ruff-specific correctness rules
    "SIM",      # simplification
    "PTH",      # pathlib over os.path / open()
    "TID",      # tidy imports
    "S",        # bandit rules: subprocess, pickle, yaml, secrets
    "LOG",      # logging misuse
    "RET",      # inconsistent returns
    "PLR",      # pylint refactor
]
ignore = [
    "E501",     # line length is handled by the formatter
    "TRY003",   # long messages belong at the raise site
    "PLR0912", "PLR0915",   # complexity is a review concern, not a lint failure
    "PLR2004",  # magic values are pervasive in a data pipeline
    "S101",     # asserts are legitimate in tests and guards
    "EM102",    # f-strings in exception args match this codebase's style
    "ANN",      # see per-file-ignores; typing is enforced on the API surface
    "PTH123",   # open() is used deliberately in fixture writers
    "D",         # docstring style is not enforced as a gate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "PLR2004", "B905", "FBT001", "FBT003"]
"scripts/**" = ["ANN", "INP001", "T201", "S603", "S607"]
"src/loan_default_risk/tuning.py" = ["ANN", "D"]
"src/models/explain_shap.py" = ["ANN", "PLR0912"]
"src/loan_default_risk/data.py" = ["ANN"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# --- black ---
[tool.black]
line-length = 100
target-version = ["py311"]

# --- mypy ---
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["src"]
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
strict_equality = true
show_error_codes = true

# --- pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Third-party deprecations (anyio's BlockingPortal alias, starlette's TestClient)
# are treated as warnings, not errors: they are upgrade jobs for dependencies,
# not defects in this repository, and failing a run on them hides real failures.
filterwarnings = [
    "default",
    "ignore::DeprecationWarning:anyio.*:",
    "ignore::DeprecationWarning:starlette.*:",
    "ignore::DeprecationWarning:fastapi.*:",
]
markers = [
    "slow: requires the full 1.34M-row pipeline and a real training run",
    "network: requires outbound access to the LendingClub archive",
]

# --- coverage ---
[tool.coverage.run]
source = ["src"]
omit = ["src/loan_default_risk/tuning.py", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 5
